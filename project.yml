# Projet Xcode généré sur le Mac de GitHub par XcodeGen (brew install xcodegen ; xcodegen).
name: JugeDeLigne
options:
  bundleIdPrefix: fr.jugedeligne
  deploymentTarget:
    iOS: "17.0"
packages:
  JugeCore:
    path: JugeCore
settings:
  base:
    DEVELOPMENT_TEAM: 8B88GLV2FD
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JugeDeLigne:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: JugeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jugedeligne.app
        PRODUCT_NAME: JugeDeLigne
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Juge de ligne
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        NSCameraUsageDescription: "La caméra filme la ligne au ralenti pour juger si la balle est bonne ou faute."
        NSPhotoLibraryUsageDescription: "Pour rejouer une vidéo au ralenti déjà filmée."
        NSMicrophoneUsageDescription: "Pour enregistrer ta propre annonce « Faute ! »."
