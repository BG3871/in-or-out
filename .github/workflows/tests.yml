# Tests du cœur du jugement (rejeu de IMG_1299 et IMG_1323) sur Linux, à chaque envoi.
name: Tests du cœur
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path JugeCore
