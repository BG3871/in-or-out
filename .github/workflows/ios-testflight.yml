# Compile l'appli Juge de ligne sur un Mac de GitHub et l'envoie sur TestFlight (App Store Connect).
# Repris du workflow de paraphe-express.
# Lancement : onglet Actions > « iOS : envoi sur TestFlight » > Run workflow.
# Secrets du dépôt (Settings > Secrets and variables > Actions) :
#   ASC_KEY_ID      identifiant de la clé API App Store Connect (rôle Admin)
#   ASC_ISSUER_ID   Issuer ID affiché sur la même page
#   ASC_KEY_P8      contenu complet du fichier AuthKey_XXXX.p8 (de -----BEGIN à END-----)
name: "iOS : envoi sur TestFlight"

on:
  workflow_dispatch:

env:
  TEAM_ID: 8B88GLV2FD

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Installer la clé API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_ID" || { echo "::error::Secret ASC_KEY_ID manquant"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          # Reconstruit un fichier PEM propre, quelle que soit la façon dont la clé a été collée
          # (sauts de ligne perdus, retours chariot Windows, espaces, ou fichier .p8 encodé en base64).
          python3 - "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" <<'PY'
          import base64, os, re, sys, textwrap
          raw = os.environ["ASC_KEY_P8"].replace("\\n", "\n")
          if "PRIVATE KEY" not in raw:
              try:
                  raw = base64.b64decode(re.sub(r"\s", "", raw)).decode()
              except Exception:
                  pass
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          if len(body) < 100:
              sys.exit("::error::Le secret ASC_KEY_P8 ne contient pas une clé .p8 valide")
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          print("Clé reconstruite :", len(body), "caractères base64")
          PY

      # L'archive est faite sans signature : la signature de développement exigerait un iPhone
      # enregistré dans le compte. La signature App Store (certificat et profil de distribution
      # créés automatiquement par la clé API) est appliquée à l'étape d'export.
      - name: Archiver (build ${{ github.run_number }})
        run: |
          xcodebuild archive \
            -project JugeDeLigne.xcodeproj -scheme JugeDeLigne -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/JugeDeLigne.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Signer et envoyer sur App Store Connect
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/JugeDeLigne.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          echo "Build ${{ github.run_number }} envoyé : il apparaîtra dans App Store Connect > TestFlight d'ici 10 à 30 minutes."
